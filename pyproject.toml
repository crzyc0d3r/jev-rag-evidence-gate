[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jev-rag-evidence-gate"
version = "0.1.0"
description = "RAG with a typed evidence gate: hybrid retrieval, one-request relevance scoring, thresholds in code"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
rag-gate = "rag_gate.pipeline:main"
rag-gate-eval = "rag_gate.evaluate:main"

[tool.setuptools.packages.find]
include = ["rag_gate*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
